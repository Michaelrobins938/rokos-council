<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roko's Council — High-Dimensional AI Deliberation Interface</title>
    <meta name="description" content="A high-dimensional AI deliberation interface featuring multiple AI personas debating complex ethical, philosophical, and strategic problems." />
    <meta name="theme-color" content="#000000" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Premium Fonts: Display (Cinzel), Body (Inter), Mono (JetBrains Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS (Utility) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #000000;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-cinzel { font-family: 'Cinzel', serif; }
      .font-mono-custom { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

    <script type="importmap">

        "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.0"
      }
    }
    </script>

    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
